# CinaToken Docker Compose Configuration
#
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000

version: '3.4'

services:
  cinatoken:
    image: calciumion/new-api:latest
    container_name: cinatoken
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api  # ⚠️ Change password in production!
      - REDIS_CONN_STRING=redis://:123456@redis:6379             # ⚠️ Change password in production!
      - CORS_ORIGINS=https://app.cinatoken.com                    # Allowed frontend origins (comma-separated)
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true                                    # Enable error logging
      - BATCH_UPDATE_ENABLED=true                                 # Enable batch update
      - NODE_NAME=cinatoken-node-1                                  # Node name for audit logs
      # - FRONTEND_BASE_URL=https://app.cinatoken.com            # Optional: frontend URL when hosted separately (e.g. Cloudflare Pages)
#     - STREAMING_TIMEOUT=300                                    # Streaming timeout (s), default 120
#     - SESSION_SECRET=random_string                              # ⚠️ Required for multi-node deployments!
#     - SYNC_FREQUENCY=60                                        # Periodic DB sync interval (s)

    depends_on:
      - redis
      - postgres
    networks:
      - cinatoken-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ Change password in production!
    networks:
      - cinatoken-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ Change password in production!
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - cinatoken-network
#    ports:
#      - "5432:5432"  # Uncomment to access PostgreSQL externally

volumes:
  pg_data:

networks:
  cinatoken-network:
    driver: bridge
